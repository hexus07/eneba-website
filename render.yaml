# Render Blueprint (Dashboard → New → Blueprint → this repo). Defines the API only; the database is
# Neon and the frontend is Vercel (see DEPLOY.md). Variables with `sync: false` are secrets or
# deployment-specific URLs: Render asks for them when the Blueprint is created, they are never in git.
services:
  - type: web
    name: gamekeys-api
    runtime: docker
    plan: free
    region: frankfurt            # keep it next to the Neon database (AWS eu-central-1)
    branch: main
    autoDeploy: true
    dockerContext: ./backend
    dockerfilePath: ./backend/Dockerfile
    healthCheckPath: /up
    buildFilter:
      paths:
        - backend/**
    envVars:
      # --- secrets / per-deployment values (you paste these) ---
      - key: APP_KEY               # php artisan key:generate --show ; NEVER change it later (it encrypts the product keys)
        sync: false
      - key: APP_URL               # https://<this service>.onrender.com
        sync: false
      - key: DB_URL                # Neon POOLED connection string (host contains "-pooler")
        sync: false
      - key: DB_DIRECT_URL         # Neon DIRECT connection string (no "-pooler"); used for migrations
        sync: false
      - key: CORS_ALLOWED_ORIGINS  # https://<your-project>.vercel.app (comma-separate several, no trailing slash)
        sync: false
      # --- fixed settings ---
      - key: PORT
        value: "8080"              # the image's nginx listens on 8080
      - key: APP_NAME
        value: gamekeys
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: "false"
      - key: LOG_CHANNEL
        value: stderr
      - key: LOG_LEVEL
        value: info
      - key: DB_CONNECTION
        value: pgsql
      - key: DB_SSLMODE
        value: require
      - key: DB_EMULATE_PREPARES   # Neon pooler = PgBouncer transaction mode
        value: "true"
      - key: SESSION_DRIVER        # stateless bearer-token API
        value: array
      - key: CACHE_STORE           # rate limiter state, shared across workers
        value: database
      - key: QUEUE_CONNECTION
        value: sync
      - key: PAYMENT_DRIVER        # the frontend only has the fake (test) payment UI
        value: fake
      - key: SANCTUM_EXPIRATION
        value: "10080"
      - key: CHECKOUT_RESERVATION_MINUTES
        value: "15"
      - key: SEED_DEMO_DATA        # seeds the demo catalog once (skips itself afterwards)
        value: "true"
      - key: RUN_MIGRATIONS
        value: "true"
